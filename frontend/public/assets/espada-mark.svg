<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- black outer circle -->
  <circle cx="50" cy="50" r="50" fill="#0a0a0a"/>
  <!-- white disk -->
  <circle cx="50" cy="50" r="43" fill="white"/>
  <!-- large upper-left oval hole (tilted ~-25deg) -->
  <ellipse cx="37" cy="37" rx="15" ry="21" transform="rotate(-25 37 37)" fill="#0a0a0a"/>
  <!-- small upper-right oval hole -->
  <ellipse cx="63" cy="33" rx="8" ry="10" fill="#0a0a0a"/>
  <!-- large lower-right oval hole (tilted ~15deg) -->
  <ellipse cx="61" cy="63" rx="13" ry="19" transform="rotate(15 61 63)" fill="#0a0a0a"/>
</svg>
