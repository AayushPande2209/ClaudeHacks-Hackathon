# fly.toml app configuration file generated for tariffshield-backend on 2026-04-19T10:33:03-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tariffshield-backend'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  PYTHONPATH = '/app/src'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
